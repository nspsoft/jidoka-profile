let lastKey=null,CURPAGE='home';
function syncHdr(){const h=qs('#hdr');if(!h)return;h.classList.toggle('onhero',CURPAGE==='home'&&window.scrollY<60&&!!qs('#herov'));}
function router(force){
 try{
  const seg=((location.hash||'').replace(/^#\/?/,'')||'home').split('/');
  const page=({home:1,products:1,product:1,application:1,manufacturing:1,quality:1,way:1,corporate:1,partnership:1,resources:1,contact:1,admin:1})[seg[0]]?seg[0]:'home';
  const key=location.hash||'#/home';
  if(!force&&key===lastKey){closeMM();return;}
  lastKey=key;
  let html='';
  if(page==='products')html=pProducts(seg[1]);
  else if(page==='product')html=pProduct(seg[1]);
  else if(page==='partnership')html=pPartnership(seg[1]);
  else if(page==='contact')html=pContact(seg[1]);
  else if(page==='admin')html=pAdmin(seg[1]);
  else html=({home:pHome,application:pApplication,manufacturing:pManufacturing,quality:pQuality,way:pWay,corporate:pCorporate,resources:pResources})[page]();
  qs('#app').innerHTML=html;
  buildChrome();
  CURPAGE=page;syncHdr();
  closeMM();
  window.scrollTo(0,0);
  mount(page,seg);
  if(page==='application'&&seg[1]){const t=qs('#'+seg[1]);if(t)setTimeout(function(){t.scrollIntoView({behavior:'smooth',block:'start'})},80);}
 }catch(e){
  console.error(e);
  qs('#app').innerHTML='<div class="wrap" style="padding:80px 24px"><h2 style="color:#0e2350">Render error</h2><p style="color:#5a6478;margin:10px 0">'+esc(e&&e.message?e.message:e)+'</p><a href="#/home">← Back to Home</a></div>';
  buildChrome();
 }
}
function mount(page,seg){
 try{
  if('IntersectionObserver' in window){
   const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
   qa('.reveal').forEach(el=>io.observe(el));
   const jic=qs('#jicos');if(jic)new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){jic.classList.add('in');o.disconnect()}})).observe(jic);
   const ch=qs('#chart');if(ch)new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){ch.classList.add('in');o.disconnect()}})).observe(ch);
  }else{qa('.reveal').forEach(el=>el.classList.add('in'));}

  if(page==='home'){
   const media=qs('#hvm'),v=qs('#hv');
   if(media&&v){
    const ok=()=>{media.classList.add('playing')};
    const fail=()=>{if(v.parentNode)v.parentNode.removeChild(v)};
    if(v.readyState>=2)ok();
    else{v.addEventListener('canplay',ok);v.addEventListener('error',fail)}
    try{const p=v.play();if(p&&p.catch)p.catch(fail);}catch(e){fail()}
    setTimeout(function(){if(!media.classList.contains('playing'))fail()},5000);
   }
  }

  if(page==='products'){
   const inp=qs('#pq'),grid=qs('#pgrid');
   const apply=f=>{const q=((inp&&inp.value)||'').trim().toLowerCase();
    const list=dP().filter(p=>(f==='all'||String(p.cat.en).toLowerCase().indexOf(f)>=0)&&(q===''||(p.name+' '+p.material+' '+L(p.lead)+' '+(p.apps||[]).join(' ')).toLowerCase().indexOf(q)>=0));
    grid.innerHTML=list.length?list.map(pcard).join(''):'<p class="empty" style="grid-column:1/-1">'+L({en:'No product matches your search. Try another keyword.',id:'Tidak ada produk yang cocok. Coba kata kunci lain.'})+'</p>';};
   qa('.toolbar .chip').forEach(c=>c.onclick=()=>{qa('.toolbar .chip').forEach(x=>x.classList.toggle('on',x===c));apply(c.dataset.f);});
   if(inp)inp.oninput=()=>{const on=qa('.toolbar .chip').filter(x=>x.classList.contains('on'))[0];apply(on?on.dataset.f:'all');};
  }

  if(page==='manufacturing'){
   const panel=qs('#tpanel');
   const show=i=>{const t=dTour()[i];qa('.tl-item').forEach((b,j)=>b.classList.toggle('on',j===i));
    panel.innerHTML='<div class="tour-panel"><div class="tour-art">'+blueprint()+'</div><div class="tour-info"><div class="tour-t"><span class="tno">'+t.n+'</span><h3>'+L(t.name)+'</h3><span class="jp">'+t.jp+'</span></div><p>'+L(t.d)+'</p><div class="tour-data">'+t.data.map(d=>'<div><b>'+d[0]+'</b><span>'+d[1]+'</span></div>').join('')+'</div></div>'
    +'<div class="tour-ctl"><button class="tbtn" id="tprev">'+ic('arrl')+' '+L({en:'Prev',id:'Sebelumnya'})+'</button><span id="tprog">'+t.n+' / 05</span><button class="tbtn" id="tnext">'+L({en:'Next',id:'Berikutnya'})+' '+ic('arrow')+'</button></div></div>';
    qs('#tprev').onclick=()=>show((i+dTour().length-1)%dTour().length);
    qs('#tnext').onclick=()=>show((i+1)%dTour().length);};
   qa('.tl-item').forEach(b=>b.onclick=()=>show(+b.dataset.i));
   show(0);
  }

  if(page==='partnership'){
   qa('.ptab').forEach(b=>b.onclick=()=>{qa('.ptab').forEach(x=>x.classList.toggle('on',x===b));
    qa('.panel').forEach(p=>p.classList.toggle('on',p.id==='pn-'+b.dataset.t));});
  }

  if(page==='contact'){
   const zone=qs('#formzone');
   const paint=t=>{zone.innerHTML=t==='rfq'?rfqForm(seg[2]||''):t==='product'?prodForm():corpForm();
    const f=zone.querySelector('form');
    f.onsubmit=ev=>{ev.preventDefault();
     let ok=true;
     qa('[required]',f).forEach(el=>{const bad=!el.value.trim()||(el.type==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
      el.closest('.f').classList.toggle('bad',bad);if(bad)ok=false;});
     const cp=qs('.captcha',f),capIn=qs('input[name=cap]',f);
     const capBad=(+capIn.value)!==(+capIn.dataset.a);cp.classList.toggle('bad',capBad);if(capBad)ok=false;
     if(qs('.hp',f).value)ok=false;
     if(!ok)return;
     const d={};qa('input,select,textarea',f).forEach(el=>{if(el.name&&el.value&&!el.classList.contains('hp'))d[el.name]=el.value});
     const labelMap={product:L({en:'Product',id:'Produk'}),width:'Width (mm)',length:'Length (mm)',thick:'Thickness (mm)',qty:L({en:'Quantity',id:'Quantity'}),app:L({en:'Application',id:'Aplikasi'}),target:L({en:'Target delivery',id:'Target pengiriman'}),company:L({en:'Company',id:'Perusahaan'}),name:L({en:'Name',id:'Nama'}),email:'Email',phone:L({en:'Phone',id:'Telepon'}),org:L({en:'Organization',id:'Organisasi'}),topic:L({en:'Topic',id:'Topik'}),type:L({en:'Type',id:'Jenis'}),msg:L({en:'Message',id:'Pesan'}),notes:L({en:'Notes',id:'Catatan'})};
     const clean={};Object.keys(d).forEach(k=>{if(k!=='cap'&&k!=='website')clean[labelMap[k]||k]=(k==='product'&&dP().find(p=>p.id===d[k]))?dP().find(p=>p.id===d[k]).name:d[k]});
     zone.innerHTML=okCard(t==='rfq'?'rfq':'inq',clean);
     const again=qs('#okagain');if(again)again.onclick=()=>{paint(t);};
     qs('.okcard').scrollIntoView({behavior:'smooth'});};};
   paint(seg[1]||'rfq');
   qa('.tab').forEach(b=>b.onclick=()=>{qa('.tab').forEach(x=>x.classList.toggle('on',x===b));paint(b.dataset.t);});
  }

  if(page==='admin'){
   if(!isLogged()){
    const lf=qs('#lform');
    if(lf)lf.onsubmit=e=>{e.preventDefault();
     if(doLogin(lf.pw.value)){toast('Selamat datang');router(true);}
     else{const fe=qs('#lerr');if(fe){fe.parentElement.classList.add('bad');fe.style.display='block';}}};
    return;
   }
   qa('.adm-nav [data-at]').forEach(b=>b.onclick=()=>goHash('#/admin/'+b.dataset.at));
   const out=qs('#admout');if(out)out.onclick=()=>{doLogout();toast('Anda telah keluar');router(true)};
   const T=seg[1]||'dash';

   if(T==='products'){
    const ped=qs('#ped');
    const open=i=>{ped.innerHTML=aProdForm(i);ped.scrollIntoView({behavior:'smooth'});
     const f=qs('#pform');
     f.onsubmit=e=>{e.preventDefault();const fd={};qa('input,select,textarea',f).forEach(el=>fd[el.name]=el.value);saveProd(fd);toast('Produk tersimpan');router(true)};
     qs('#pcancel').onclick=()=>{ped.innerHTML=''};};
    const ap=qs('#addp');if(ap)ap.onclick=()=>open(-1);
    qa('[data-pe]').forEach(b=>b.onclick=()=>open(+b.dataset.pe));
    qa('[data-pd]').forEach(b=>b.onclick=()=>{if(confirm('Hapus produk ini?')){const P=dP();P.splice(+b.dataset.pd,1);DB.set('products',P);toast('Produk dihapus');router(true)}});
   }
   if(T==='news'){
    const ned=qs('#ned');
    const open=i=>{ned.innerHTML=aNewsForm(i);ned.scrollIntoView({behavior:'smooth'});
     const f=qs('#nform');
     f.onsubmit=e=>{e.preventDefault();const fd={};qa('input,textarea',f).forEach(el=>fd[el.name]=el.value);saveNews(fd);toast('Berita tersimpan');router(true)};
     qs('#ncancel').onclick=()=>{ned.innerHTML=''};};
    const an=qs('#addn');if(an)an.onclick=()=>open(-1);
    qa('[data-ne]').forEach(b=>b.onclick=()=>open(+b.dataset.ne));
    qa('[data-nd]').forEach(b=>b.onclick=()=>{if(confirm('Hapus berita ini?')){const N=dN();N.splice(+b.dataset.nd,1);DB.set('news',N);toast('Berita dihapus');router(true)}});
   }
   if(T==='caps'){
    const f=qs('#cform');
    if(f)f.onsubmit=e=>{e.preventDefault();const fd={};qa('input,textarea',f).forEach(el=>fd[el.name]=el.value);saveCaps(fd);toast('Kapabilitas tersimpan');router(true)};
   }
   if(T==='resources'){
    const red=qs('#red');
    const open=i=>{red.innerHTML=aResForm(i);red.scrollIntoView({behavior:'smooth'});
     const f=qs('#rform');
     f.onsubmit=e=>{e.preventDefault();const fd={};qa('input,select,textarea',f).forEach(el=>fd[el.name]=el.value);saveRes(fd);toast('Dokumen tersimpan');router(true)};
     qs('#rcancel').onclick=()=>{red.innerHTML=''};};
    const ar=qs('#addr');if(ar)ar.onclick=()=>open(-1);
    qa('[data-re]').forEach(b=>b.onclick=()=>open(+b.dataset.re));
    qa('[data-rd]').forEach(b=>b.onclick=()=>{if(confirm('Hapus dokumen ini?')){const R=dR();R.splice(+b.dataset.rd,1);DB.set('resources',R);toast('Dokumen dihapus');router(true)}});
   }
   if(T==='company'){
    const f=qs('#coform');
    if(f)f.onsubmit=e=>{e.preventDefault();const fd={};qa('input,textarea',f).forEach(el=>fd[el.name]=el.value);
     DB.set('company',{phone:fd.phone,sales:fd.sales,corp:fd.corp,addr:fd.addr,hours:fd.hours,video:(fd.video||'').trim()});
     if(fd.npw){const d=dbRead(),s=d.settings||{};s.password=fd.npw;DB.set('settings',s);}
     toast('Tersimpan');router(true)};
   }
   if(T==='backup'){
    const dl=qs('#dlj');if(dl)dl.onclick=()=>{try{const b=new Blob([qs('#expj').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jri-content-backup.json';document.body.appendChild(a);a.click();a.remove();toast('Download dimulai')}catch(e){toast('Download diblokir — gunakan tombol Salin')}};
    const cp=qs('#cpj');if(cp)cp.onclick=()=>{const t=qs('#expj');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'JSON tersalin ke clipboard':'Salin manual dengan Ctrl+C');};
    const ib=qs('#impb');if(ib)ib.onclick=()=>{try{const d=JSON.parse(qs('#impj').value);if(typeof d!=='object'||!d||Array.isArray(d))throw new Error('bukan objek');dbWrite(d);toast('Data berhasil dimuat');router(true)}catch(e){toast('JSON tidak valid: '+e.message)}};
    const rb=qs('#rstb');if(rb)rb.onclick=()=>{if(confirm('Hapus SEMUA perubahan dan kembali ke data default?')){DB.resetAll();toast('Kembali ke data default');router(true)}};
   }
  }
 }catch(e){console.error(e)}
}

document.addEventListener('click',function(e){
 const t=e.target instanceof Element?e.target:null;if(!t)return;
 const a=t.closest('a[href^="#/"]');if(!a)return;
 e.preventDefault();
 goHash(a.getAttribute('href'));
});
window.addEventListener('hashchange',()=>router(true));
window.addEventListener('scroll',()=>{qs('#totop').classList.toggle('show',scrollY>500);syncHdr();},{passive:true});
qs('#totop').onclick=()=>{try{scrollTo({top:0,behavior:'smooth'})}catch(e){scrollTo(0,0)}};
router(true);
})();
</script>
</body>
</html>
